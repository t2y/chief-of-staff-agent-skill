name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: command -v jq || brew install jq
      - run: mise run lint
      - run: mise run test
